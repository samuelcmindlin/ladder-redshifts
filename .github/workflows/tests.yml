name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the lowest version pyproject.toml declares. GitHub has no build of it for the Ubuntu 26.04
          # image that ubuntu-latest now points to, so that job stays on 24.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (astropy is needed by the extraction test)
        run: python -m pip install -r requirements.txt
      - name: Tests from the checkout
        run: python -m pytest -q
      - name: Install the package and run it outside the checkout
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          LADDER_REDSHIFTS_ROOT="$GITHUB_WORKSPACE" python -m ladder_redshifts.batch_real
          LADDER_REDSHIFTS_ROOT="$GITHUB_WORKSPACE" python -m ladder_redshifts.summary
