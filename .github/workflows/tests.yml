name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]    # 3.9 is the lowest version pyproject.toml declares
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (astropy is needed by the extraction test)
        run: python -m pip install -r requirements.txt
      - name: Tests from the checkout
        run: python -m pytest -q
      - name: Install the package and run it outside the checkout
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          LADDER_REDSHIFTS_ROOT="$GITHUB_WORKSPACE" python -m ladder_redshifts.batch_real
          LADDER_REDSHIFTS_ROOT="$GITHUB_WORKSPACE" python -m ladder_redshifts.summary
