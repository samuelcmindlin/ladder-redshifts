[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ladder-redshifts"
version = "0.1.0"
description = "Redshifts from molecular line ladders as missing-fundamental pitch estimation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Samuel Mindlin"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Repository = "https://github.com/samuelcmindlin/ladder-redshifts"

[project.optional-dependencies]
archive = ["astropy>=5.0"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["ladder_redshifts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
